music_directory                "~/Music"
playlist_directory             "~/.mpd/playlists"

auto_update "yes"
bind_to_address "127.0.0.1"
restore_paused "yes"

audio_output {
        type          "alsa"
        name          "ALSA sound card"
}

audio_output {
        type            "pipewire"
        name            "PipeWire Sound Server"
}

audio_output {
   type   "fifo"
   name   "my_fifo"
   path   "/tmp/mpd.fifo"
   format "44100:16:2"
}
