# modified from https://github.com/MrVivekRajan/Hyprlock-Styles/tree/main Style-6

# BACKGROUND
background {
  monitor =
  path = $HOME/.config/wallpapers/ametoasphalt1.png
  blur_passes = 1
  contrast = 0.9
  brightness = 0.8
  vibrancy = 0.2
  vibrancy_darkness = 0.0
}

# GENERAL
general {
  grace = 0
  ignore_empty_input = true
}

# Day-Month-Date
label {
  monitor =
  text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
  color = rgba(255, 255, 255, 1.0)
  font_size = 32
  font_family = SF Pro Rounded
  position = 0, -480
  halign = center
  valign = top
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
  color = rgba(255, 255, 255, 1.0)
  font_size = 120
  font_family = SF Pro Rounded
  position = 0, -240
  halign = center
  valign = top
}

# INPUT FIELD
input-field {
  monitor =
  size = 480, 80
  font_size = 24
  rounding = 16
  outline_thickness = 4
  dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = true
  outer_color = rgba(0, 0, 0, 0)
  inner_color = rgba(200, 200, 200, 0.4)
  font_color = rgb(255, 255, 255)
  fade_on_empty = false
  font_family = SF Pro Rounded
  placeholder_text = <i><span foreground="##ffffff99">Password</span></i>
  hide_input = false
  position = 0, 160
  halign = center
  valign = bottom
}
