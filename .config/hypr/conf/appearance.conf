#####################
### LOOK AND FEEL ###
#####################

general {
  gaps_in = 0
  gaps_out = 0

  border_size = 2 # 2

  # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
  col.active_border = rgba(7e9cd8ff)
  col.inactive_border = rgba(595959aa)

  # Set to true enable resizing windows by clicking and dragging on borders and gaps
  resize_on_border = true

  # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
  allow_tearing = false

  layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 0

  # Change transparency of focused and unfocused windows
  active_opacity = 1.0
  inactive_opacity = 1.0

  # https://wiki.hyprland.org/Configuring/Variables/#blur
  blur {
    enabled = true
    size = 3
    passes = 1

    vibrancy = 0.1696
  }
}

# Prevents animations from activating on screenshots

layerrule = no_anim on, match:namespace hyprpicker
layerrule = no_anim on, match:namespace selection

windowrule = suppress_event maximize match:class .* # You'll probably like this.

animations {
  enabled = true

  # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

  bezier = bounce, 0.0, 1.25, 0.15, 1.0
  bezier = buttery, 0.1, 1.15, 0.15, 1.02
  bezier = smooth, 0.0, 0.0, 0.12, 1.0
  bezier = linear, 0.0, 0.0, 1.0, 1.0

  animation = windowsIn, 1, 4.5, bounce, slide
  animation = windowsOut, 1, 3.5, smooth, slide
  animation = windowsMove, 1, 4, buttery, slide

  animation = fadeIn, 1, 3.5, smooth
  animation = fadeOut, 1, 3, smooth
  animation = fadeDim, 1, 4, smooth
  animation = fadeShadow, 1, 4, smooth

  animation = border, 1, 7, smooth
  animation = borderangle, 1, 35, linear, loop

  animation = layersIn, 1, 4, bounce, slide
  animation = layersOut, 1, 3, smooth, slide
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
  pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
  new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
  force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
  disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
  allow_session_lock_restore = 1
  vfr = true
}
